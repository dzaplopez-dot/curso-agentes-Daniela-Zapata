[project]
name = "inventario-inteligente"
version = "0.1.0"
description = "Asistente local de inventario para la práctica del Módulo 3"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.5"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
